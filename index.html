<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Versão 6 — Carnaval Edition</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #1e0538; /* Roxo folia profundo */
      padding: 1rem;
    }

    .cartao {
      background: #2e0954; 
      border: 3px solid #ffd700; /* Amarelo Ouro Carnaval */
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(255, 215, 0, 0.25);
      text-align: center;
      color: #fff0f5;
    }

    .emoji { 
      font-size: 4rem; 
      letter-spacing: 0.3rem;
    }

    h1 { 
      margin: .5rem 0; 
      color: #ffd700; 
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
    } 

    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: #440d7c;
      border: 1px solid #ff1493; /* Rosa/Magenta vibrante */
      text-align: left;
      line-height: 1.8;
      color: #ffe4e1;
    }

    code { 
      background: #ff1493; 
      color: #ffffff; 
      padding: 2px 6px; 
      border-radius: 6px; 
      font-weight: bold;
    }

    footer { 
      margin-top: 1.5rem; 
      padding-top: 1rem; 
      border-top: 1px solid #ff1493; 
      color: #ffb6c1; 
      font-size: .85rem; 
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="emoji">🎭🎉🥁</div>
    <h1>Versão 6 - Correta</h1>
    <p>O erro foi corrigido em ritmo de folia! 🎊✨</p>
    <p>Lembrete: "Não deixe para amanhã o que se pode fazer hoje"</p> 

    <div class="versao">
      🤖 <strong>Publicado pelo robô em:</strong> __DATA__<br>
      🎷 <strong>Commit:</strong> <code>__COMMIT__</code><br>
      👑 <strong>Enviado por:</strong> <strong>__AUTOR__</strong>
    </div>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>
  </main>
</body>
</html>
